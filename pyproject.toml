[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tvmirror"
version = "0.1.0"
description = "Hyprland-aware wrapper for FluxCast Miracast screen casting on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
